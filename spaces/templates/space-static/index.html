    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>__SPACE_TITLE__</title>
    <style>
      /* Bare reset only — no house style. Author your own look here to your
         art-direction plan (light and dark palettes, type, layout); replace
         this whole block. */
      * { box-sizing: border-box; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <!--
      This is a lite (static) web artifact: one self-contained HTML page.
      Edit this file directly. Keep styles and scripts inline, and drop binary
      assets (images, fonts, audio) into ./assets/, then reference them with a
      normal relative path:

        <img src="assets/photo.png" alt="…" />

      The build copies ./assets/ verbatim into the served bundle and the page
      loads each file over HTTP — the asset stays a real, editable file, never
      base64-inlined, and nothing rewrites this HTML. There is no server,
      database, or build step to learn.
    -->
    <main>
      <h1>__SPACE_TITLE__</h1>
      <p>Placeholder — replace this page with your build.</p>
    </main>
  </body>
</html>
