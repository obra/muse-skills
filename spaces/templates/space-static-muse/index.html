    <!-- Applies Hatch's light/dark and accent before the first paint. Hatch
         passes them in the URL fragment; this removes them again so the page
         never sees them. Keep this script first in <head>. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hash = new URLSearchParams(location.hash.slice(1));
          var scheme =
            hash.get("hatch_theme") ||
            new URLSearchParams(location.search).get("hatch_theme");
          var accent = hash.get("hatch_accent");
          var accents = "blue green red purple pink orange monochrome";
          if (scheme === "light" || scheme === "dark") {
            root.setAttribute("data-hatch-color-scheme", scheme);
          }
          if (accent && accents.split(" ").indexOf(accent) !== -1) {
            root.setAttribute("data-hatch-accent", accent);
          }
          if (hash.has("hatch_theme") || hash.has("hatch_accent")) {
            hash.delete("hatch_theme");
            hash.delete("hatch_accent");
            var rest = hash.toString();
            history.replaceState(
              history.state,
              "",
              location.pathname + location.search + (rest ? "#" + rest : ""),
            );
          }
          var current = root.getAttribute("data-hatch-color-scheme");
          root.classList.toggle(
            "dark",
            current
              ? current === "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches,
          );
        } catch (error) {}
      })();

    <!-- Later theme changes arrive from the embedding frame; the attributes
         above and the `dark` class follow them without a reload. -->
    <script>
      (function () {
        var root = document.documentElement;
        var schemes = ["light", "dark"];
        var accents = ["blue", "green", "red", "purple", "pink", "orange", "monochrome"];
        function syncDark() {
          var host = root.getAttribute("data-hatch-color-scheme");
          var dark = schemes.indexOf(host) !== -1
            ? host === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          root.classList.toggle("dark", dark);
        }
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncDark);
        if (window.parent !== window) {
          window.addEventListener("message", function (event) {
            if (event.source !== window.parent) return;
            var data = event.data;
            if (!data || typeof data !== "object") return;
            if (data.type !== "hatch:space:theme" || data.version !== 1) return;
            if (schemes.indexOf(data.colorScheme) === -1) return;
            if (accents.indexOf(data.accentColor) === -1) return;
            root.setAttribute("data-hatch-color-scheme", data.colorScheme);
            root.setAttribute("data-hatch-accent", data.accentColor);
            syncDark();
          });
        }
        syncDark();
      })();
    </script>
